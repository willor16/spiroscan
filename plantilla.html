<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpiroScan</title>
<noscript><meta http-equiv="refresh" content="0; url=__URL__"></noscript>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F6F7F9; color: #111827;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  main { text-align: center; padding: 24px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { color: #4B5563; }
  a { color: #1D4ED8; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>SpiroScan</h1>
  <p>Abriendo la app…</p>
  <p><a id="entrar" href="__URL__">Entrar a SpiroScan</a></p>
</main>
<script>
  // Dirección fija de SpiroScan: lleva al link vigente del servidor (lo actualiza la Mac en link.json).
  (function () {
    function go(url) {
      document.getElementById('entrar').href = url;
      location.replace(url + location.search + location.hash);
    }
    fetch('link.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { go(d.url); })
      .catch(function () { go('__URL__'); });
  })();
</script>
</body>
</html>
